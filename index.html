
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#eaf0ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gestione Spese">
  <meta name="mobile-web-app-capable" content="yes">

  <title>Gestione Spese</title>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/acefede/app_spese/7f07e870d23a967a9ac475a9e051658a2f384f48/icon_png.png">
  <link rel="shortcut icon" type="image/png" href="https://raw.githubusercontent.com/acefede/app_spese/7f07e870d23a967a9ac475a9e051658a2f384f48/icon_png.png">
  <link rel="apple-touch-icon" sizes="180x180" href="https://raw.githubusercontent.com/acefede/app_spese/7f07e870d23a967a9ac475a9e051658a2f384f48/icon_png.png">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 100%;
      overflow: hidden;
    }

    @supports (height: 100dvh) {
      html, body {
        height: 100dvh;
      }
    }

    @supports (height: 100svh) {
      html, body {
        min-height: 100svh;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: #eef2ff;
      color: #182238;
    }

    #status {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 28px;
      text-align: center;
      font-size: 16px;
      line-height: 1.45;
      overflow-wrap: anywhere;
      background: linear-gradient(145deg, #f4f7ff, #e5ecff);
    }

    #status .mark {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      object-fit: cover;
      box-shadow: 0 8px 24px rgba(28, 74, 150, .18);
    }

    #status .detail {
      color: #68758e;
      font-size: 13px;
      max-width: 360px;
    }

    /* Iframe ancorato al bordo inferiore dello schermo */
    #app-frame {
      position: fixed;
      left: 0;
      right: 0;
      top: auto;
      bottom: 0;
      width: 100%;
      height: 100vh;
      height: 100svh;
      height: 100dvh;
      border: 0;
      display: none;
      background: #eef2ff;
      margin: 0;
      z-index: 1;
    }
  </style>
</head>

<body>
  <main id="status" role="status" aria-live="polite">
    <img class="mark" src="https://raw.githubusercontent.com/acefede/app_spese/7f07e870d23a967a9ac475a9e051658a2f384f48/icon_png.png" alt="">
    <strong>Gestione Spese</strong>
    <span id="status-message">Preparazione dell'app...</span>
    <span class="detail" id="status-detail"></span>
  </main>

  <iframe
    id="app-frame"
    title="Gestione Spese"
    allow="clipboard-write">
  </iframe>

  <script>
    (() => {
      "use strict";

      const status = document.getElementById("status");
      const message = document.getElementById("status-message");
      const detail = document.getElementById("status-detail");
      const frame = document.getElementById("app-frame");

      const showError = (text, extra = "") => {
        message.textContent = text;
        detail.textContent = extra;
        status.style.display = "flex";
        frame.style.display = "none";
      };

      let value;

      try {
        value = decodeURIComponent(window.location.hash.slice(1)).trim();
      } catch (_) {
        showError(
          "Il collegamento non è valido.",
          "Controlla l'indirizzo GitHub Pages."
        );
        return;
      }

      if (!value) {
        showError(
          "Manca il collegamento alla Web App.",
          "Apri la pagina GitHub Pages aggiungendo # seguito dall'ID del deployment Apps Script."
        );
        return;
      }

      let appUrl;

      const fullUrlPattern =
        /^https:\/\/script\.google\.com\/macros\/s\/([A-Za-z0-9_-]+)\/exec\/?$/;

      const fullMatch = value.match(fullUrlPattern);

      if (fullMatch) {
        appUrl =
          "https://script.google.com/macros/s/" +
          fullMatch[1] +
          "/exec";
      } else if (/^[A-Za-z0-9_-]+$/.test(value)) {
        appUrl =
          "https://script.google.com/macros/s/" +
          value +
          "/exec";
      } else {
        showError(
          "ID o indirizzo non valido.",
          "Inserisci l'ID del deployment oppure l'indirizzo completo che termina in /exec."
        );
        return;
      }

      message.textContent = "Apertura della tua app...";
      detail.textContent = "Connessione a Google Apps Script";

      let loaded = false;

      const timeout = window.setTimeout(() => {
        if (!loaded) {
          showError(
            "L'app sta impiegando troppo tempo ad aprirsi.",
            "Controlla la connessione e verifica che la Web App sia ancora distribuita."
          );
        }
      }, 20000);

      frame.addEventListener("load", () => {
        loaded = true;
        window.clearTimeout(timeout);
        status.style.display = "none";
        frame.style.display = "block";
      });

      frame.src = appUrl;
    })();
  </script>
</body>
</html>
